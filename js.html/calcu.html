.<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
    }
    .calculator {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      max-width: 350px;
    }
    .display-container {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 10px;
    }
    #expression {
      width: 100%;
      height: 30px;
      font-size: 16px;
      color: #6c757d;
      text-align: right;
      border: none;
      background: transparent;
      margin-bottom: 5px;
    }
    #display {
      width: 100%;
      height: 50px;
      font-size: 28px;
      font-weight: bold;
      text-align: right;
      border: none;
      background: transparent;
      color: #212529;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      background-color: #74bac0;
      height: 60px;
      font-size: 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #5aa0a8;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .operator {
      background-color: #ff9500;
      color: white;
    }
    .operator:hover {
      background-color: #e6850e;
    }
    .equals {
      background-color: #34c759;
      color: white;
      grid-column: span 2;
    }
    .equals:hover {
      background-color: #2fb94f;
    }
    .clear {
      background-color: #ff3b30;
      color: white;
    }
    .clear:hover {
      background-color: #e6352b;
    }
    .backspace {
      background-color: #8e8e93;
      color: white;
    }
    .backspace:hover {
      background-color: #7d7d82;
    }
    #steps {
      font-size: 16px;
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px solid #ddd;
      padding-top: 10px;
      color: #333;
    }
    #steps p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h3 style="text-align: center; margin-top: 0; color: #333;">Calculator</h3>
    
    <div class="display-container">
      <input type="text" id="expression" readonly placeholder="0">
      <input type="text" id="display" readonly value="0">
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="backspace" onclick="backspace()">⌫</button>
      <button onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>
      
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>
      
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>
      
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>
      
      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>

    <div id="steps"></div>
  </div>

  <script>
    let currentExpression = "";
    let lastResult = "0";
    let justCalculated = false;

    function appendNumber(num) {
      if (justCalculated) {
        currentExpression = "";
        justCalculated = false;
      }
      
      if (num === '.' && currentExpression === "") {
        currentExpression = "0.";
      } else if (num === '.' && currentExpression.slice(-1) === '.') {
        return;
      } else {
        currentExpression += num;
      }
      
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentExpression === "" && op !== '-') return;
      
      if (justCalculated) {
        currentExpression = lastResult;
        justCalculated = false;
      }
      
      const lastChar = currentExpression.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentExpression = currentExpression.slice(0, -1) + op;
      } else {
        currentExpression += op;
      }
      
      updateDisplay();
    }

    function calculate() {
      if (currentExpression === "") return;
      
      try {
        let expression = currentExpression.replace(/%/g, '/100');
        
        let result = Function('"use strict"; return (' + expression + ')')();
        
        if (!isFinite(result)) {
          result = "Error";
        } else {
          result = Math.round(result * 100000000) / 100000000;
          result = result.toString();
        }
        
        lastResult = result;
        justCalculated = true;
        
        document.getElementById('expression').value = currentExpression + " =";
        document.getElementById('display').value = result;

        // ✅ keep calculation history (your original code feature)
        document.getElementById("steps").innerHTML += `<p>${currentExpression} = ${result}</p>`;
        
        currentExpression = result; 
        
      } catch (error) {
        document.getElementById('display').value = "Error";
        currentExpression = "";
      }
    }

    function clearDisplay() {
      currentExpression = "";
      lastResult = "0";
      justCalculated = false;
      updateDisplay();
      document.getElementById('expression').value = "";
      document.getElementById('steps').innerHTML = "";
    }

    function backspace() {
      if (justCalculated) {
        clearDisplay();
        return;
      }
      
      if (currentExpression.length > 0) {
        currentExpression = currentExpression.slice(0, -1);
        updateDisplay();
      }
    }

    function updateDisplay() {
      if (currentExpression === "") {
        document.getElementById('display').value = "0";
        document.getElementById('expression').value = "";
      } else {
        document.getElementById('display').value = currentExpression;
        document.getElementById('expression').value = "";
      }
    }

    // ✅ Keyboard support
    document.addEventListener('keydown', function(event) {
      if (event.key >= '0' && event.key <= '9') {
        appendNumber(event.key);
      } else if (event.key === '.') {
        appendNumber('.');
      } else if (event.key === '+' || event.key === '-' || event.key === '*' || event.key === '/') {
        appendOperator(event.key);
      } else if (event.key === 'Enter' || event.key === '=') {
        calculate();
      } else if (event.key === 'Backspace') {
        backspace();
      } else if (event.key === 'Escape' || event.key === 'c' || event.key === 'C') {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
